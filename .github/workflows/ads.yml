name: Render adverts
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Advert spec in ops/ads (without .json)"
        required: true
        default: "black-friday"
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install pillow fonttools brotli
      - name: Pull b-roll and music assets from the ads branch
        run: git fetch -q origin ads --depth 1 && git checkout FETCH_HEAD -- assets || echo "no assets yet"
      - run: python3 scripts/make_ad.py "ops/ads/${{ inputs.spec }}.json" "out/${{ inputs.spec }}.mp4"
      - name: Save to the ads branch (not deployed)
        run: |
          git config user.name "hourwright-ads"; git config user.email "ads@hourwright.co.uk"
          cp out/* /tmp/
          git fetch origin ads --depth 1 && git checkout -B ads origin/ads || git checkout --orphan ads
          git rm -rq --cached . 2>/dev/null || true
          mkdir -p ads && cp /tmp/${{ inputs.spec }}.* ads/
          git add ads/${{ inputs.spec }}.*
          git commit -qm "Render ${{ inputs.spec }} advert" && git push -q origin HEAD:ads
