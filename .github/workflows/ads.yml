name: Render adverts
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Advert spec(s) in ops/ads, space-separated (without .json)"
        required: true
        default: "black-friday"
permissions:
  contents: write
concurrency:
  group: ads-branch
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install pillow fonttools brotli
      - name: Pull b-roll and music assets from the ads branch
        run: git fetch -q origin ads --depth 1 && git checkout FETCH_HEAD -- assets || echo "no assets yet"
      - env:
          SPECS: ${{ inputs.spec }}
        run: for s in $SPECS; do python3 scripts/make_ad.py "ops/ads/$s.json" "out/$s.mp4"; done
      - name: Save to the ads branch (not deployed)
        env:
          SPECS: ${{ inputs.spec }}
        run: |
          git config user.name "hourwright-ads"; git config user.email "ads@hourwright.co.uk"
          cp out/* /tmp/
          git fetch origin ads --depth 1 && git checkout -f -B ads origin/ads || { git checkout --orphan ads; git rm -rq --cached .; }
          mkdir -p ads && for s in $SPECS; do cp /tmp/$s.* ads/; git add ads/$s.*; done
          git commit -qm "Render adverts: $SPECS" && git push -q origin HEAD:ads
