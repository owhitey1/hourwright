name: Awin programmes and tracking
# Uses the Awin Publisher API, so it needs no browser sign-in and runs with
# Steve's computer off. Prints yes/no only: no earnings in public logs.
on:
  schedule:
    - cron: "37 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  awin:
    runs-on: ubuntu-latest
    env:
      AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/awin_status.py
