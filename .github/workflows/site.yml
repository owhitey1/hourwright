name: Update feeds, build and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover tests
      - name: Fetch retailer feeds
        env:
          AWIN_FEED_URL_JURA: ${{ secrets.AWIN_FEED_URL_JURA }}
          AWIN_FEED_URL_GOLDSMITHS: ${{ secrets.AWIN_FEED_URL_GOLDSMITHS }}
          AWIN_FEED_URL_BEAVERBROOKS: ${{ secrets.AWIN_FEED_URL_BEAVERBROOKS }}
        id: feed
        continue-on-error: true
        run: python scripts/fetch_feed.py
      - name: Editorial check (report only)
        run: python scripts/editorial_check.py || echo "::warning::Editorial check found articles needing review (see summary)"
      - name: Build
        run: python build.py
      - name: Check links
        run: python scripts/check_links.py
      - name: Launch gate
        id: gate
        run: python scripts/launch_check.py || echo "prelaunch=1" >> "$GITHUB_OUTPUT"
      - name: Pre-launch build (noindex, for retailer review only)
        if: steps.gate.outputs.prelaunch == '1'
        run: HW_PRELAUNCH=1 python build.py
      - name: Save price history
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add data/products.json
          git diff --cached --quiet || git commit -m "Update retailer feed data"
          git push
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Record feed result
        id: feedresult
        run: echo "failed=${{ steps.feed.outcome == 'failure' }}" >> "$GITHUB_OUTPUT"
    outputs:
      feed_failed: ${{ steps.feedresult.outputs.failed }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke test the live site
        run: |
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors https://hourwright.co.uk/ | grep -q "Hourwright"
          curl -fsSL https://hourwright.co.uk/watches/index.html | grep -q "Luxury watches"
      - name: Alert if a retailer feed failed
        if: needs.build.outputs.feed_failed == 'true'
        run: |
          echo "A retailer feed was rejected or unreachable. The site was deployed from the last good data; prices are hidden automatically once that data is more than 3 days old."
          exit 1
