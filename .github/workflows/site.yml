name: Update feeds, build and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"   # daily, 05:17 UTC
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m unittest discover tests
      - name: Fetch retailer feeds
        env:
          AWIN_FEED_URL_JURA: ${{ secrets.AWIN_FEED_URL_JURA }}
          AWIN_FEED_URL_GOLDSMITHS: ${{ secrets.AWIN_FEED_URL_GOLDSMITHS }}
          AWIN_FEED_URL_BEAVERBROOKS: ${{ secrets.AWIN_FEED_URL_BEAVERBROOKS }}
          RAKUTEN_TOKEN_KEY: ${{ secrets.RAKUTEN_TOKEN_KEY }}
        id: feed
        continue-on-error: true
        run: python scripts/fetch_feed.py
      - name: Editorial check (report only)
        run: python scripts/editorial_check.py || echo "::warning::Editorial check found articles needing review (see summary)"
      - name: Build
        run: python build.py
      - name: Check links
        run: python scripts/check_links.py
      - name: Launch gate
        id: gate
        run: python scripts/launch_check.py || echo "prelaunch=1" >> "$GITHUB_OUTPUT"
      - name: Pre-launch build (noindex, for retailer review only)
        if: steps.gate.outputs.prelaunch == '1'
        run: HW_PRELAUNCH=1 python build.py
      - name: Save price history
        # Another commit may land while this run builds; rebase onto it (keeping
        # this run's fresh feed data) and retry. A failure here never blocks the deploy.
        continue-on-error: true
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add data/products.json
          git diff --cached --quiet && exit 0
          git commit -m "Update retailer feed data"
          for i in 1 2 3; do
            git push && exit 0
            sleep $((i * 5)); git pull --rebase -X theirs origin "${GITHUB_REF_NAME:-main}"
          done
          echo "::warning::Could not save price history after 3 attempts"; exit 1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Record feed result
        id: feedresult
        run: echo "failed=${{ steps.feed.outcome == 'failure' }}" >> "$GITHUB_OUTPUT"
    outputs:
      feed_failed: ${{ steps.feedresult.outputs.failed }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            scripts/indexnow.py
            static/root
      - name: Record the live sitemap before deploying
        run: |
          curl -fsS https://hourwright.co.uk/sitemap.xml -o /tmp/old-sitemap.xml || true
          KEY=$(basename static/root/*.txt)
          curl -fsS -o /dev/null "https://hourwright.co.uk/$KEY" && echo "FIRST=" >> "$GITHUB_ENV" || echo "FIRST=--first-run" >> "$GITHUB_ENV"
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke test the live site
        run: |
          # Save to a file first: piping into grep -q closes the pipe early, which curl reports as an error and retries.
          curl -fsSL --retry 8 --retry-delay 15 --retry-all-errors https://hourwright.co.uk/ -o /tmp/home.html
          grep -q "Hourwright" /tmp/home.html
          curl -fsSL https://hourwright.co.uk/watches/index.html -o /tmp/watches.html
          grep -q "Luxury watches" /tmp/watches.html
      - name: Notify IndexNow (Bing and others) of new or changed pages
        continue-on-error: true
        run: |
          KEY=$(basename static/root/*.txt)
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "https://hourwright.co.uk/$KEY" -o /dev/null
          curl -fsS https://hourwright.co.uk/sitemap.xml -o /tmp/new-sitemap.xml
          python3 scripts/indexnow.py /tmp/old-sitemap.xml /tmp/new-sitemap.xml $FIRST
      - name: Alert if a retailer feed failed
        if: needs.build.outputs.feed_failed == 'true'
        run: |
          echo "A retailer feed was rejected or unreachable. The site was deployed from the last good data; prices are hidden automatically once that data is more than 3 days old."
          exit 1
