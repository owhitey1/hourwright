name: Engineering task (Claude)
description: Code, hosting, feeds, SEO infrastructure, security, deployment. Only Claude implements these.
title: "[Eng] "
labels: ["agent:claude", "type:engineering", "status:backlog"]
body:
  - type: textarea
    id: what
    attributes: {label: What is needed and why, description: "Include the page URL or evidence."}
    validations: {required: true}
  - type: dropdown
    id: priority
    attributes: {label: Priority, options: ["priority:high", "priority:medium", "priority:low"]}
    validations: {required: true}
  - type: textarea
    id: done
    attributes: {label: Completion criteria, description: "How we will know it is finished."}
    validations: {required: true}
  - type: input
    id: raised
    attributes: {label: Raised by, placeholder: "Grok / ChatGPT / Steve"}
